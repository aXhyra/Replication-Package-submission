<meta charset="utf-8">
<title>OCEAN Results Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ============================================================
   Tokens - complete light palette on bare :root, redefined for
   the two dark states. Nothing is defined only inside a block.
   ============================================================ */
:root {
  color-scheme: light;
  --ground:  #eef1ef;
  --panel:   #ffffff;
  --panel-2: #f6f8f7;
  --panel-3: #eceff0;
  --ink:     #131a21;
  --ink-2:   #4d5863;
  --ink-3:   #7c8792;
  --rule:    #dee3e5;
  --rule-2:  #c6cdd1;
  --ring:    #131a21;

  /* sequential ramp - blue, light -> dark (magnitude) */
  --r0: #f2f5f6; --r1: #cde2fb; --r2: #9ec5f4; --r3: #6da7ec;
  --r4: #2a78d6; --r5: #1c5cab; --r6: #0d366b;
  --r-hi-text: #ffffff;
  --r-lo-text: #131a21;

  /* diverging pair - blue <-> red, gray midpoint (polarity) */
  --d-neg-2: #e34948; --d-neg-1: #f3aead;
  --d-mid:   #f0efec;
  --d-pos-1: #b7d3f6; --d-pos-2: #2a78d6;

  /* categorical - validated slots 1-3 (identity) */
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a;

  /* header roles - the two personality dimensions of a column */
  --role-pass: #131a21;
  --role-drv:  #35657a;

  /* status - fixed, never themed; always shipped with icon + label */
  --critical: #d03b3b;
  --good:     #0ca30c;
  --warning:  #fab219;
  --critical-bg: #fbeaea;
  --good-bg:     #e9f6e9;
  /* prevention: a failure that the strategy removed */
  --prevented:    #2a78d6;
  --prevented-bg: #e8f1fd;

  --shadow: 0 1px 2px rgba(19,26,33,.05), 0 4px 14px rgba(19,26,33,.05);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:  #0d1015; --panel: #171b21; --panel-2: #1d222a; --panel-3: #232932;
    --ink:     #e7ebef; --ink-2: #9ba7b3; --ink-3: #6e7a87;
    --rule:    #262d36; --rule-2: #39424c; --ring: #e7ebef;
    --r0: #1a1f27; --r1: #16304c; --r2: #184f95; --r3: #256abf;
    --r4: #3987e5; --r5: #6da7ec; --r6: #9ec5f4;
    --r-hi-text: #0d1015; --r-lo-text: #e7ebef;
    --d-neg-2: #e66767; --d-neg-1: #6d2b2b;
    --d-mid: #383835;
    --d-pos-1: #1c3f63; --d-pos-2: #3987e5;
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70;
    --role-pass: #e7ebef; --role-drv: #8fc0d0;
    --critical-bg: #2c1719; --good-bg: #14261a; --prevented-bg: #13243a; --prevented-bg: #13243a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:  #0d1015; --panel: #171b21; --panel-2: #1d222a; --panel-3: #232932;
  --ink:     #e7ebef; --ink-2: #9ba7b3; --ink-3: #6e7a87;
  --rule:    #262d36; --rule-2: #39424c; --ring: #e7ebef;
  --r0: #1a1f27; --r1: #16304c; --r2: #184f95; --r3: #256abf;
  --r4: #3987e5; --r5: #6da7ec; --r6: #9ec5f4;
  --r-hi-text: #0d1015; --r-lo-text: #e7ebef;
  --d-neg-2: #e66767; --d-neg-1: #6d2b2b;
  --d-mid: #383835;
  --d-pos-1: #1c3f63; --d-pos-2: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70;
  --role-pass: #e7ebef; --role-drv: #8fc0d0;
  --critical-bg: #2c1719; --good-bg: #14261a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1400px; margin: 0 auto; padding: 30px 26px 84px; display: flex; flex-direction: column; gap: 26px; }
h1,h2,h3 { font-family: Archivo, "IBM Plex Sans", sans-serif; margin: 0; text-wrap: pretty; letter-spacing: -.015em; }
h1 { font-size: 30px; font-weight: 700; line-height: 1.15; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
p { margin: 0; }
.mono, code { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
:where(button, a, [tabindex]):focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 3px; }

/* ---------- masthead + nav ---------- */
.masthead { display: flex; flex-direction: column; gap: 12px; }
.masthead .lede { color: var(--ink-2); font-size: 14.5px; }
.crumbs { display: flex; align-items: center; gap: 7px; font-size: 12.5px; flex-wrap: wrap; }
.crumbs button { font: inherit; font-size: 12.5px; background: none; border: 0; padding: 0; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--rule-2); }
.crumbs button:hover { color: var(--ink); }
.crumbs .sep { color: var(--ink-3); }
.crumbs .here { color: var(--ink); font-weight: 500; }

.formula { border: 1px solid var(--rule); border-left: 3px solid var(--ink-3); border-radius: 0 7px 7px 0; background: var(--panel-2); padding: 10px 15px; font-size: 12.5px; color: var(--ink-2); overflow-x: auto; white-space: nowrap; }
.formula b { color: var(--ink); font-weight: 500; }

.provenance { display: flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 7px; background: var(--panel); overflow: hidden; }
.provenance div { padding: 8px 15px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 1px; flex: 1 1 auto; }
.provenance div:last-child { border-right: 0; }
.provenance dt { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.provenance dd { margin: 0; font-size: 12.5px; }

/* ---------- segmented toggle ---------- */
.seg { display: flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden;
       box-shadow: 0 1px 0 rgba(19, 26, 33, .05); }
.seg button { font: inherit; font-size: 12.5px; font-weight: 500; padding: 7px 15px; border: 0;
              border-right: 1px solid var(--rule-2); background: var(--panel-2);
              color: var(--ink-2); cursor: pointer; white-space: nowrap;
              text-decoration: underline; text-underline-offset: 3px;
              text-decoration-color: var(--rule-2); transition: background .1s ease; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--panel-3); color: var(--ink); text-decoration-color: var(--ink-3); }
.seg button:active { background: var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel);
                                   text-decoration-color: var(--panel); }
@media (prefers-reduced-motion: reduce) { .seg button { transition: none; } }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.stat { background: var(--panel); padding: 12px 16px; display: flex; flex-direction: column; gap: 1px; }
.stat .v { font-family: Archivo, sans-serif; font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 11.5px; color: var(--ink-2); }

/* ---------- panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 9px; box-shadow: var(--shadow); }
.panel-head { padding: 15px 18px 12px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
.panel-head p { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.panel-body { padding: 16px 18px; }

/* ---------- results table ---------- */
.tscroll { overflow-x: auto; }
table.results { border-collapse: separate; border-spacing: 2px; width: 100%; min-width: 960px; table-layout: fixed; }
table.results th.corner { width: 216px; vertical-align: bottom; padding: 0 12px 6px 0; }
table.results th.corner .key { display: block; font-size: 11.5px; font-weight: 600; line-height: 1.25; }
table.results th.corner .key.ps { color: var(--role-pass); }
table.results th.corner .key.dr { color: var(--role-drv); }
table.results th.pers { padding: 0 0 6px; vertical-align: bottom; }
table.results th.pers button { width: 100%; font: inherit; font-size: 11.5px; font-weight: 600; background: none; border: 0; padding: 3px 2px; color: var(--ink); cursor: pointer; line-height: 1.25; border-bottom: 2px solid var(--rule-2); }
table.results th.pers button:hover { border-bottom-color: var(--ink); background: var(--panel-2); }
table.results th.pers .ps { display: block; color: var(--role-pass); }
table.results th.pers .dr { display: block; color: var(--role-drv); }
tr.group td { padding: 14px 0 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
th.scen { text-align: left; padding: 0 12px 0 0; vertical-align: middle; }
th.scen button { font: inherit; font-size: 12.5px; font-weight: 500; text-align: left; background: none; border: 0; padding: 3px 0; color: var(--ink); cursor: pointer; width: 100%; }
th.scen button:hover .nm { text-decoration: underline; text-underline-offset: 2px; }
th.scen .nm { display: block; }
/* prior-only rows have no button to inherit from, so match it here */
th.scen > .nm { font-size: 12.5px; font-weight: 500; color: var(--ink); padding: 3px 0; }
th.scen .mech { display: block; font-size: 10px; color: var(--ink-3); font-weight: 400; line-height: 1.3; }
td.rc { padding: 0; }
button.verdict {
  width: 100%; min-height: 42px; border: 1px solid var(--rule); border-radius: 4px; cursor: pointer;
  font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0; padding: 5px 4px; background: var(--panel-2); color: var(--ink-2);
}
button.verdict:hover { border-color: var(--ink-3);
                       box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--ink-3); }
button.verdict .g { font-size: 13px; font-weight: 700; line-height: 1.15; letter-spacing: .02em; }
button.verdict .ts { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; font-variant-numeric: tabular-nums; opacity: .85; }
button.verdict.fail { background: var(--critical-bg); border-color: var(--critical); color: var(--critical); }
button.verdict.pass { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 45%, transparent); color: var(--good); }
button.verdict.prevented { background: var(--prevented-bg); border-color: var(--prevented); color: var(--prevented); }
button.verdict.prevented:hover { filter: brightness(1.12) saturate(1.15);
                                 box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--prevented); }
button.verdict.notrun { background: var(--panel-2); border-color: var(--rule); color: var(--ink-3);
                        cursor: default; }
button.verdict.fail:hover, button.verdict.pass:hover { filter: brightness(1.18) saturate(1.2); }
button.verdict.fail:hover { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--critical); }
button.verdict.pass:hover { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--good); }

.paperv { display: flex; align-items: center; justify-content: center; min-height: 42px;
          font-size: 11.5px; font-weight: 600; letter-spacing: .02em; cursor: default; }
.paperv.fail { color: var(--critical); }
.paperv.pass { color: var(--good); }
.paperv.absent { color: var(--ink-3); font-weight: 400; }
table.results th.paper { text-align: center; }
table.results th.paper span { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink);
                              padding-bottom: 5px; border-bottom: 2px solid var(--rule-2); }
table.results th.paper .src { font-size: 10px; font-weight: 400; color: var(--ink-3); border: 0; padding: 0; }

/* ---------- verdict banner ---------- */
.verdict-banner { display: flex; gap: 13px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--rule); border-left: 4px solid var(--ink-3); border-radius: 0 8px 8px 0; background: var(--panel); }
.verdict-banner.fail { border-left-color: var(--critical); background: var(--critical-bg); }
.verdict-banner.pass { border-left-color: var(--good); background: var(--good-bg); }
.verdict-banner .vg { font-family: Archivo, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.verdict-banner.fail .vg { color: var(--critical); }
.verdict-banner.pass .vg { color: var(--good); }
.verdict-banner p { font-size: 13px; color: var(--ink-2); }
.verdict-banner strong { color: var(--ink); font-weight: 600; }


/* ---------- figures ---------- */
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px,1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.fig { background: var(--panel-2); padding: 9px 12px; }
.fig .v { font-family: "IBM Plex Mono", monospace; font-size: 15.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.fig .k { font-size: 10.5px; color: var(--ink-3); line-height: 1.35; }


.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr));
          gap: 30px 48px; }   /* row gap, column gap - side-by-side blocks need the wider one */
.block .sub { font-size: 11.5px; color: var(--ink-3); margin: 2px 0 11px; line-height: 1.45; }

/* signed bars */
.rows { display: flex; flex-direction: column; gap: 7px; }
.row-i { display: grid; grid-template-columns: 104px 1fr 64px; align-items: center; gap: 10px; }
.row-i .lab { font-size: 12px; color: var(--ink-2); }
.row-i .track { position: relative; height: 15px; background: var(--panel-3); border-radius: 3px; }
.row-i .track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--rule-2); }
.row-i .bar { position: absolute; top: 2px; bottom: 2px; border-radius: 2px; }
.row-i .v { font-family: "IBM Plex Mono", monospace; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.row-i.total { border-top: 1px solid var(--rule); padding-top: 7px; }
.row-i.total .lab, .row-i.total .v { font-weight: 600; color: var(--ink); }

/* magnitude bars (single direction) */
.mrow { display: grid; grid-template-columns: 1fr 54px; gap: 10px; align-items: center; font-size: 12px; }
.mrow .lt { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mrow .mt { position: relative; height: 13px; background: var(--panel-3); border-radius: 3px; flex: 1; min-width: 40px; }
.mrow .mt i { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 2px; background: var(--r4); display: block; }
.mrow .nm { white-space: nowrap; }
.mrow .v { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; text-align: right; }

/* stacked */
.stack { display: flex; height: 26px; border-radius: 3px; overflow: hidden; gap: 2px; background: var(--panel-3); }
.stack span { display: block; min-width: 2px; }
.sl { display: grid; grid-template-columns: 12px 1fr auto 50px; gap: 8px; align-items: center; font-size: 12px; margin-top: 6px; }
.sl i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.sl .n { color: var(--ink-2); }
.sl .v, .sl .p { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
.sl .p { color: var(--ink-3); font-size: 11px; text-align: right; }

/* metric tables */
table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
table.data th { text-align: left; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 0 9px 6px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.data td { padding: 6px 9px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data .ml { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; }
table.data .n { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
table.data .fam { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.up { color: var(--d-pos-2); }
.down { color: var(--d-neg-2); }
.muted { color: var(--ink-3); }
.none { color: var(--ink-3); font-style: italic; font-size: 12px; }

/* mini list of cells */
.minicells { display: flex; flex-wrap: wrap; gap: 6px; }
.minicells button { font: inherit; font-size: 11.5px; padding: 4px 9px; border-radius: 4px; border: 1px solid var(--rule-2); background: var(--panel-2); color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.minicells button:hover { border-color: var(--ink-3); color: var(--ink); }
.minicells button.fail { background: var(--critical-bg); border-color: color-mix(in srgb, var(--critical) 40%, transparent); color: var(--critical); }
.minicells button.fail:hover { border-color: var(--critical); color: var(--critical); background: color-mix(in srgb, var(--critical) 14%, var(--critical-bg)); }
.minicells button .b { font-weight: 700; }
.minicells button.notrun { background: var(--panel-2); border-color: var(--rule); color: var(--ink-3); cursor: default; }
.minicells button.pass2 { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 45%, transparent); color: var(--good); }
.minicells button.pass2:hover { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--good-bg)); }
.minicells button.warn { background: color-mix(in srgb, var(--warning) 14%, var(--panel-2)); border-color: color-mix(in srgb, var(--warning) 55%, transparent); color: color-mix(in srgb, var(--warning) 70%, var(--ink)); }
.minicells button.warn:hover { border-color: var(--warning); background: color-mix(in srgb, var(--warning) 26%, var(--panel-2)); }
button.lnk { font: inherit; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--rule-2); }
button.lnk:hover { text-decoration-color: var(--ink-3); }
.cta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 4px 2px; }
.cta button { font: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: var(--panel); cursor: pointer; }
.cta button:hover { filter: brightness(1.25); }
.cta .note { font-size: 12px; color: var(--ink-2); }
.pat { display: flex; flex-direction: column; gap: 22px; }
.cond { display: flex; flex-direction: column; gap: 14px; }
.cond .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.cond .who h4 { font-size: 12.5px; font-weight: 600; margin: 0; }
.cond .who .n { font-size: 11px; color: var(--ink-3); }
.cond .who button { font: inherit; font-size: 11px; background: none; border: 0; padding: 0; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--rule-2); }
table.data td.tol { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; text-align: right; }
.summary { margin: 0; padding-left: 18px; }
.summary li { font-size: 13px; line-height: 1.6; margin-bottom: 7px; }
.summary li b { font-weight: 600; }
.pat h3 { font-size: 13px; font-weight: 600; margin: 0 0 3px; }
.pat p.sub { font-size: 12px; color: var(--ink-2); margin: 0 0 9px; line-height: 1.5; }
.pat .tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 12px; }
.pat .tier { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; background: var(--panel-2); }
.pat .tier .t { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 7px; }
.pat .tier .t b { color: var(--ink); }
.pat table.data td.n { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
.pat .flip { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.pat .flip .row { display: grid; grid-template-columns: 200px 1fr; gap: 10px; align-items: start; }
.pat .flip .who { font-weight: 500; }
.pat .flip .lst { display: flex; flex-wrap: wrap; gap: 5px; }
.pat .flip .lst span.k { font-size: 10.5px; color: var(--ink-3); align-self: center; margin-right: 2px; }
.pat .read li { font-size: 12.5px; line-height: 1.55; margin-bottom: 4px; }
.tip { cursor: help; text-decoration: underline dotted; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
#tooltip { position: fixed; z-index: 50; max-width: 340px; padding: 8px 11px; border-radius: 6px;
           background: var(--ink); color: var(--panel); font-size: 12px; line-height: 1.45;
           box-shadow: var(--shadow); pointer-events: none; opacity: 0; transition: opacity .08s ease; }
#tooltip.on { opacity: 1; }

.legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 13px; font-size: 11.5px; color: var(--ink-2); }

.sw i { width: 10px; height: 10px; border-radius: 2px; display: block; flex: none; }

.glossary { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px,1fr)); gap: 20px 26px; }

.chart text { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }

.chart .rd { fill: var(--ink); font-size: 16px; }

footer { font-size: 11.5px; color: var(--ink-3); border-top: 1px solid var(--rule); padding-top: 16px; line-height: 1.6; }

.hr { height: 1px; background: var(--rule); margin: 22px 0; border: 0; }
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <p class="eyebrow">Ride-hailing simulation &middot; San Francisco</p>
      <h1>OCEAN Results Dashboard</h1>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </header>

  <main id="view"></main>

  <footer id="footer"></footer>
</div>

<script id="payload" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("payload").textContent);
  const M = D.meta;
  const SC = M.scenarios, PE = M.personalities;
  const $ = (id) => document.getElementById(id);

  // Every string here is authored in this file, never user input, so inline markup is safe:
  // a value containing a tag is set as HTML, anything else is escaped as plain text. That
  // lets captions carry <b>, <em> or <span class="mono"> without a separate helper.
  const HAS_TAG = /<[a-z][^>]*>/i;
  const el = (t, c, x) => {
    const n = document.createElement(t);
    if (c) n.className = c;
    if (x != null) {
      if (typeof x === "string" && HAS_TAG.test(x)) n.innerHTML = x;
      else n.textContent = x;
    }
    return n;
  };
  const add = (p, ...kids) => { kids.forEach((k) => k && p.append(k)); return p; };
  const num = (v, n) => (v == null || Number.isNaN(v)) ? "\u2013" : Number(v).toFixed(n);
  const sgn = (v, n) => (v == null || Number.isNaN(v)) ? "\u2013" : (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(n);
  const int = (v) => (v == null || Number.isNaN(v)) ? "\u2013" : Math.round(v).toLocaleString("en-US");

  const PRETTY = {
    baseline: ["General", "General"],
    bank_tellers: ["Bank Tellers", "General"],
    students: ["Students", "General"],
    managers: ["Managers", "General"],
    drivers: ["General", "Drivers"],
    bank_tellers_drivers: ["Bank Tellers", "Drivers"],
    students_drivers: ["Students", "Drivers"],
    managers_drivers: ["Managers", "Drivers"]
  };
  const pname = (p) => PRETTY[p][0] + " \u00d7 " + PRETTY[p][1];
  const drvLabel = (p) => PRETTY[p][1] === "Drivers" ? "Drivers" : "General";
  const ACRONYMS = { Tncs: "TNCs" };
  const sname = (s) => s.split("-")
    .map((x) => x.replace(/_/g, " ").replace(/\b\w/g, (m) => m.toUpperCase()))
    .map((x) => x.replace(/\b(\w+)\b/g, (w) => ACRONYMS[w] || w))
    .join(" + ");
  const FAMILY = (f) => f.replace(/_/g, " ");

  // Where a spike sits relative to the injected event. "during" is an overlap test, not
  // containment: the spike and the event window intersect at some point.
  const POSITION = {
    during:  ["during", "failure during the injected event"],
    post:    ["post", "failure began within an hour after the event"],
    outside: ["outside", "failure after the event window"]
  };

  // The simulation clock starts at 21:00 the day before, so midnight falls 3 h in - exactly
  // where the plotted window begins. The x axis is drawn against that midnight, which puts
  // the event (raw t = 79,200 s) at 19:00 and ends the axis at 24:00.
  const DAY_START = 3 * 3600;                 // raw simulation seconds at 00:00
  const AXIS_END = DAY_START + 24 * 3600;     // raw simulation seconds at 24:00
  const clock = (raw) => {
    const h = (raw - DAY_START) / 3600;
    const hh = Math.floor(h), mm = Math.round((h - hh) * 60);
    return (mm === 60 ? hh + 1 : hh).toString().padStart(2, "0") + ":"
         + (mm === 60 ? 0 : mm).toString().padStart(2, "0");
  };

  // The threshold set the verdicts rest on, and the per-run values derived from it.
  let SHOW_PAPER = false;
  const TH = () => M.threshold;
  const blOf = (c) => (c && c.b) || {};
  const blOfInfo = (info) => (info && info.b) || {};

  const cellOf = new Map();
  D.cells.forEach((c) => cellOf.set(c.scenario + "|" + c.personality, c));

  /* ---------- prevention strategies ----------
     Each strategy is a second grid over the same events and personalities, holding the
     runs executed with that strategy active. STRAT is the grid currently on screen: null is
     the runs without prevention, which is what every other view still describes. */
  const PREV = D.prevention || {};
  const STRATS = Object.keys(PREV);
  let STRAT = null;
  const prevCellOf = (k, s, p) => (PREV[k] ? PREV[k].cells[s + "|" + p] : null) || null;
  // green: it was passing already; blue: the strategy removed the failure; red: it still fails
  const OUTCOME = {
    "still passes": { cls: "pass", tag: "\u2713 PASS", note: "passed without prevention too" },
    "prevented":    { cls: "prevented", tag: "\u25c6 PREVENTED", note: "fail otherwise" },
    "still fails":  { cls: "fail", tag: "\u2715 FAIL", note: "fails with and without prevention" },
    "new failure":  { cls: "fail", tag: "\u2715 FAIL", note: "passed without prevention" }
  };
  const outcomeOf = (c) => OUTCOME[c && c.outcome] ||
        { cls: (c && c.failure) ? "fail" : "pass", tag: (c && c.failure) ? "\u2715 FAIL" : "\u2713 PASS", note: "" };

  /* A prevention strategy is a grid of its own: the cells it was run on, in the same shape
     the rest of the page expects, plus the event and personality aggregates recomputed
     over those cells alone. Cells the strategy has not been run on are simply absent, so
     every view shows them as not run instead of borrowing a verdict from another grid. */
  function prevGrid(k) {
    const cells = new Map();
    Object.keys(PREV[k].cells).forEach((key) => {
      const r = PREV[k].cells[key];
      const spike = r.spike_start == null ? null : {
        start: r.spike_start, end: r.spike_end, dur: r.spike_duration_min,
        peak: r.spike_peak, mean: r.spike_mean, pos: r.position,
        ns: r.d_not_served, ca: r.d_cancel, de: r.d_demand,
        share_ns: r.share_not_served, driver: r.dominant_driver,
        nsPre: r.not_served_pre, nsIn: r.not_served_spike,
        caPre: r.cancel_pre, caIn: r.cancel_spike
      };
      const affected = (r.affected || []).map((m) => ({
        m: m.metric, f: "", dev: m.dev_vs_own, ref: m.dev_vs_reference,
        lvl: m.spike_level, base: m.own_baseline_level }));
      const b = { failure: r.failure, failure_timestamp: r.failure_timestamp,
                  n_spikes: r.n_spikes, spike_minutes: r.spike_minutes,
                  spike_minutes_in_event: r.spike_minutes_in_event,
                  d_not_served: r.d_not_served, d_cancel: r.d_cancel,
                  share_not_served: r.share_not_served,
                  failSpike: spike, affected: affected };
      cells.set(key, Object.assign({}, r, {
        window: { nsPre: r.ns_pre, nsIn: r.ns_in, caPre: r.ca_pre, caIn: r.ca_in },
        failSpike: spike, affected: affected, b: b, prevention: k
      }));
    });

    const agg = (keys, pick) => {
      const list = keys.map((x) => cells.get(pick(x))).filter(Boolean);
      const nums = (f) => list.map((c) => c[f]).filter((x) => x != null);
      const mean = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
      const med = (a) => { const l = a.slice().sort((x, y) => x - y);
                           return l.length ? l[Math.floor((l.length - 1) / 2)] : null; };
      const failed = list.filter((c) => c.failure === true);
      const bb = { nFail: failed.length, n: list.length,
                   spikeMin: mean(nums("spike_minutes")) };
      return { list: list, failed: failed, n: list.length, nFail: failed.length,
               meanIndex: mean(nums("fr_mean_event")),
               meanIndexRange: [Math.min.apply(null, nums("fr_mean_event").concat([Infinity])),
                                Math.max.apply(null, nums("fr_mean_event").concat([-Infinity]))],
               peak: Math.max.apply(null, nums("fr_peak").concat([-Infinity])),
               spikeMin: mean(nums("spike_minutes")),
               medianFailTs: med(failed.map((c) => c.failure_timestamp).filter((x) => x != null)),
               b: bb };
    };

    const scenarios = {}, personalities = {};
    SC.forEach((x) => {
      const a = agg(PE, (p) => x + "|" + p);
      scenarios[x] = Object.assign({}, D.scenarios[x], a, {
        failedBy: a.failed.map((c) => c.personality),
        topMetrics: [], families: [], traits: [], additivity: null,
        window: (D.scenarios[x] || {}).window });
    });
    PE.forEach((x) => {
      const a = agg(SC, (sx) => sx + "|" + x);
      personalities[x] = Object.assign({}, D.personalities[x], a, {
        failedIn: a.failed.map((c) => c.scenario),
        topMetrics: [], families: [], traits: [], conditions: [], additivity: null });
    });
    return { cells: cells, scenarios: scenarios, personalities: personalities };
  }

  const PREV_GRID = {};
  STRATS.forEach((k) => { PREV_GRID[k] = prevGrid(k); });
  const BASE_GRID = { cells: cellOf, scenarios: D.scenarios, personalities: D.personalities };
  // Every view reads the grid through these, so selecting a strategy switches the whole page
  const G = () => (STRAT && PREV_GRID[STRAT]) || BASE_GRID;
  const gridCell = (key) => G().cells.get(key);
  const isRun = (s, p) => G().cells.has(s + "|" + p);

  /* ================= routing ================= */
  // The selected prevention strategy travels in the hash, so a reload or a shared link
  // lands on the same grid the page was showing.
  const stripK = (h) => { const i = h.indexOf("?k="); return i >= 0 ? h.slice(0, i) : h; };
  const curPath = () => stripK(decodeURIComponent(location.hash.replace(/^#/, ""))) || "/";
  const go = (h) => { location.hash = h + (STRAT ? "?k=" + STRAT : ""); };
  function route() {
    let h = decodeURIComponent(location.hash.replace(/^#/, ""));
    const i = h.indexOf("?k=");
    if (i >= 0) {
      const k = h.slice(i + 3);
      STRAT = PREV[k] ? k : null;
      h = h.slice(0, i);
    }
    const p = h.split("/").filter(Boolean);
    if (p[0] === "x" && PREV[p[1]]) STRAT = p[1];
    if (p[0] === "d" && cellOf.has(p[1] + "|" + p[2])) return { v: "cell", s: p[1], p: p[2] };
    if (p[0] === "x" && prevCellOf(p[1], p[2], p[3])) return { v: "prevcell", k: p[1], s: p[2], p: p[3] };
    if (p[0] === "s" && D.scenarios[p[1]]) return { v: "scenario", s: p[1] };
    if (p[0] === "p" && D.personalities[p[1]]) return { v: "personality", p: p[1] };
    if (p[0] === "patterns") return { v: "patterns" };
    return { v: "home" };
  }

  function crumbs(r) {
    const c = $("crumbs");
    c.innerHTML = "";
    const home = el("button", null, "All results");
    home.type = "button";
    home.addEventListener("click", () => go("/"));
    if (r.v === "home") { c.append(el("span", "here", "All results")); return; }
    c.append(home);
    const sep = () => el("span", "sep", "\u203a");
    if (r.v === "scenario") add(c, sep(), el("span", "here", "Event \u00b7 " + sname(r.s)));
    if (r.v === "personality") add(c, sep(), el("span", "here", "Personality \u00b7 " + pname(r.p)));
    if (r.v === "patterns") add(c, sep(), el("span", "here", "Patterns"));
    if (r.v === "prevcell") {
      const hb = el("button", null, PREV[r.k].label); hb.type = "button";
      hb.addEventListener("click", () => { STRAT = r.k; go("/"); });
      add(c, sep(), hb, sep(), el("span", "here", sname(r.s) + " \u00b7 " + pname(r.p)));
    }
    if (r.v === "cell") {
      const sb = el("button", null, sname(r.s)); sb.type = "button";
      sb.addEventListener("click", () => go("/s/" + r.s));
      const pb = el("button", null, pname(r.p)); pb.type = "button";
      pb.addEventListener("click", () => go("/p/" + r.p));
      add(c, sep(), sb, sep(), pb, sep(), el("span", "here", "Dataset"));
    }
  }

  /* ================= shared pieces ================= */
  function panel(title, sub, right) {
    const s = el("section", "panel");
    const h = el("div", "panel-head");
    const l = el("div");
    add(l, el("h2", null, title), sub ? el("p", null, sub) : null);
    add(h, l, right || null);
    const b = el("div", "panel-body");
    add(s, h, b);
    return { panel: s, body: b };
  }

  function figs(items) {
    const f = el("div", "figs");
    items.forEach(([v, k]) => add(f, add(el("div", "fig"), el("div", "v", String(v)), el("div", "k", k))));
    return f;
  }

  function signedRows(parts, totalRow) {
    const max = Math.max(...parts.map((x) => Math.abs(x[1] || 0)), Math.abs(totalRow ? totalRow[1] || 0 : 0)) || 1;
    const rows = el("div", "rows");
    const mk = (lab, v, cls) => {
      const r = el("div", "row-i" + (cls ? " " + cls : ""));
      const t = el("div", "track");
      const b = el("div", "bar");
      const frac = Math.min(1, Math.abs(v || 0) / max) * 50;
      if ((v || 0) >= 0) { b.style.left = "50%"; b.style.width = frac + "%"; b.style.background = "var(--d-pos-2)"; }
      else { b.style.right = "50%"; b.style.width = frac + "%"; b.style.background = "var(--d-neg-2)"; }
      t.append(b);
      add(r, el("div", "lab", lab), t, el("div", "v", sgn(v, 3)));
      return r;
    };
    parts.forEach(([l, v]) => rows.append(mk(l, v)));
    if (totalRow) rows.append(mk(totalRow[0], totalRow[1], "total"));
    return rows;
  }

  // Hover text for a robust-z value: what moved, by how much, against which reference.
  function zTip(metric, z, against) {
    const dir = z >= 0 ? "up" : "down";
    return metric + " moved " + num(Math.abs(z), 1) + "\u03c3 (robust standard deviations) " + dir + " " + against + ".";
  }
  // Hover text for a trait: a metric the event (or personality) moves the same way everywhere.
  const BY_Z = (z) => z == null ? "" : ", by " + num(Math.abs(z), 1) + "\u03c3 (robust standard deviations) on average";
  const TRAIT_SCEN = (m, z, d) => m + " is a trait of this event: the event moves it " + d
    + " from its normal-run level for every one of the eight personalities" + BY_Z(z) + ".";
  const TRAIT_PERS = (m, z, d) => m + " is a trait of this personality: it moves " + d
    + " from the reference personality in every one of the 15 events" + BY_Z(z) + ".";
  const withTip = (node, tip) => { if (tip) { node.dataset.tip = tip; node.classList.add("tip"); } return node; };

  // One floating tooltip for every .tip element; shown at once on hover, unlike the native title.
  const tipBox = el("div"); tipBox.id = "tooltip"; document.body.append(tipBox);
  function placeTip(target) {
    const r = target.getBoundingClientRect();
    tipBox.style.left = "0px"; tipBox.style.top = "0px";
    const w = tipBox.offsetWidth, h = tipBox.offsetHeight;
    let x = r.left + r.width / 2 - w / 2, y = r.top - h - 8;
    x = Math.max(8, Math.min(x, window.innerWidth - w - 8));
    if (y < 8) y = r.bottom + 8;
    tipBox.style.left = x + "px"; tipBox.style.top = y + "px";
  }
  document.addEventListener("mouseover", (e) => {
    const t = e.target.closest(".tip");
    if (!t) return;
    tipBox.textContent = t.dataset.tip; tipBox.classList.add("on"); placeTip(t);
  });
  document.addEventListener("mouseout", (e) => {
    const t = e.target.closest(".tip");
    if (t && !(e.relatedTarget && t.contains(e.relatedTarget))) tipBox.classList.remove("on");
  });
  addEventListener("scroll", () => tipBox.classList.remove("on"), true);

  function magRows(items, unit, tipOf) {
    const max = Math.max(...items.map((i) => Math.abs(i[1]))) || 1;
    const w = el("div", "rows");
    items.forEach(([name, v]) => {
      const r = el("div", "mrow");
      const lt = el("div", "lt");
      const mt = el("div", "mt");
      const i = el("i");
      i.style.width = (Math.abs(v) / max * 100) + "%";
      mt.append(i);
      add(lt, el("span", "nm", name), mt);
      add(r, lt, withTip(el("span", "v", num(v, 2) + (unit || "")), tipOf ? tipOf(name, v) : null));
      w.append(r);
    });
    return w;
  }

  function decompBlock(c) {
    // Nothing spiked, so there is no rise to take apart: the caller drops the block entirely
    // rather than showing an empty one (add() skips a null child).
    if (blOf(c).d_not_served == null) return null;
    const b = el("div", "block");
    add(b, el("h3", null, "What the rise is made of"));
    const riseTwo = (blOf(c).d_not_served || 0) + (blOf(c).d_cancel || 0);
    add(b, el("p", "sub", "How much of the rise from the pre-spike hour each failure metric is responsible for, "
      + "split by <b>Shapley</b> value. They account for a rise of " + sgn(riseTwo, 3) + " in the index."));
    const comps = [["rides_not_served", blOf(c).d_not_served, "var(--cat-1)"],
                   ["passengers_cancel", blOf(c).d_cancel, "var(--cat-2)"]];
    const tot = comps.reduce((a, x) => a + Math.abs(x[1]), 0) || 1;
    const st = el("div", "stack");
    comps.forEach(([, v, col]) => { const s = el("span"); s.style.width = (Math.abs(v) / tot * 100) + "%"; s.style.background = col; st.append(s); });
    b.append(st);
    comps.forEach(([n, v, col]) => {
      const r = el("div", "sl");
      const i = el("i"); i.style.background = col;
      add(r, i, el("span", "n mono", n), el("span", "v", sgn(v, 3)), el("span", "p", (Math.abs(v) / tot * 100).toFixed(0) + "%"));
      b.append(r);
    });
    return b;
  }

  // The proportion of failures between the two metrics, at their actual levels. Used for the
  // spike a failure sits in, and over the event window for runs that never failed.
  function splitBlock(title, subText, lv) {
    const b = el("div", "block");
    add(b, el("h3", null, title), el("p", "sub", subText));
    if (!lv || lv.nsIn == null) {
      add(b, el("p", "none", "no levels recorded for this run"));
      return b;
    }
    const comps = [["rides_not_served", lv.nsIn, "var(--cat-1)"],
                   ["passengers_cancel", lv.caIn, "var(--cat-2)"]];
    const tot = comps.reduce((a, x) => a + Math.abs(x[1] || 0), 0) || 1;
    const st = el("div", "stack");
    comps.forEach(([, lvl, col]) => {
      const sp = el("span");
      sp.style.width = (Math.abs(lvl || 0) / tot * 100) + "%";
      sp.style.background = col;
      st.append(sp);
    });
    b.append(st);
    comps.forEach(([n, lvl, col]) => {
      const r = el("div", "sl");
      const i = el("i"); i.style.background = col;
      add(r, i, el("span", "n mono", n), el("span", "v", num(lvl, 3)),
             el("span", "p", (Math.abs(lvl || 0) / tot * 100).toFixed(0) + "%"));
      b.append(r);
    });
    return b;
  }

  // The reference run is what every other cell is measured against, so its own three parts are
  // zero by construction and the block says nothing. The caller drops it (add() skips null).
  const isReferenceRun = (c) => c.personality === M.reference_config[0]
                             && c.scenario === M.reference_config[1];

  function attributionBlock(c) {
    if (isReferenceRun(c)) return null;
    const b = el("div", "block");
    add(b, el("h3", null, "Event, personality, or the pairing"),
           el("p", "sub", "Event-window index against the no-personality normal run. The three parts sum to the total exactly."));
    b.append(signedRows([
      ["Event", c.fr_scenario_effect],
      ["Personality", c.fr_personality_effect],
      ["Interaction", c.fr_interaction_effect]
    ], ["Total", c.fr_total_effect]));
    const lg = el("div", "legend");
    add(lg, swatch("var(--d-pos-2)", "raises the index"), swatch("var(--d-neg-2)", "lowers it"));
    b.append(lg);
    return b;
  }

  const SVGNS = "http://www.w3.org/2000/svg";
  const svg = (tag, attrs) => {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  // One line chart, shared by the run view (a single trace) and the event view (eight).
  // Everything is drawn to one pair of scales; colours come from the theme tokens.
  function indexChart(defs, opts) {
    opts = opts || {};
    const W = 1000, H = opts.height || 240;
    const L = 56, R = 18, T = 14, B = 34;
    const thr = TH().p99_h;

    // A failed run is drawn only up to the moment it was declared failed - past that point
    // the simulation is no longer describing a system that is still meeting its contract.
    const live = defs.filter((d) => d.trace && d.trace.v && d.trace.v.length).map((d) => {
      if (d.cutAt == null) return d;
      const keep = Math.floor((d.cutAt - d.trace.t0) / d.trace.dt) + 1;
      if (keep >= d.trace.v.length || keep < 2) return d;
      return Object.assign({}, d, { trace: Object.assign({}, d.trace, { v: d.trace.v.slice(0, keep) }) });
    });
    const wrap = el("div");
    if (!live.length) {
      add(wrap, el("p", "none", "no index trace available for this run"));
      return wrap;
    }

    const vMax = 1.0;                      // fixed: the index is a share of requests
    let tMin = Infinity, tMax = -Infinity;
    live.forEach((d) => {
      const n = d.trace.v.length;
      tMin = Math.min(tMin, d.trace.t0);
      tMax = Math.max(tMax, d.trace.t0 + (n - 1) * d.trace.dt);
    });
    if (opts.xMin != null) tMin = opts.xMin;
    if (opts.xMax != null) tMax = opts.xMax;
    const x = (t) => L + (t - tMin) / (tMax - tMin) * (W - L - R);
    const y = (v) => T + (1 - Math.min(v, vMax) / vMax) * (H - T - B);

    const g = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart",
                           preserveAspectRatio: "none", role: "img" });

    // event window, then the injection instant
    if (opts.event) {
      g.append(svg("rect", { x: x(opts.event[0]), y: T, width: Math.max(1, x(opts.event[1]) - x(opts.event[0])),
                             height: H - T - B, fill: "var(--panel-3)" }));
      g.append(svg("line", { x1: x(opts.event[0]), x2: x(opts.event[0]), y1: T, y2: H - B,
                             stroke: "var(--ink-3)", "stroke-width": 1, "stroke-dasharray": "3 3" }));
      const evLab = svg("text", { x: x(opts.event[0]) + 5, y: T + 13, class: "ax", fill: "var(--ink-3)" });
      evLab.textContent = "event " + clock(opts.event[0]);
      g.append(evLab);
    }

    // y grid at 0, threshold and the top of the scale
    [0, thr, vMax].forEach((v, i) => {
      g.append(svg("line", { x1: L, x2: W - R, y1: y(v), y2: y(v),
                             stroke: i === 1 ? "var(--critical)" : "var(--rule)",
                             "stroke-width": 1, "stroke-dasharray": i === 1 ? "5 4" : "0" }));
      const lab = svg("text", { x: L - 8, y: y(v) + 5, class: "ax", "text-anchor": "end",
                                fill: i === 1 ? "var(--critical)" : "var(--ink-3)" });
      lab.textContent = v.toFixed(2);
      g.append(lab);
    });
    const thrLab = svg("text", { x: W - R, y: y(thr) - 7, class: "ax", "text-anchor": "end", fill: "var(--critical)" });
    thrLab.textContent = "hardiness threshold";
    g.append(thrLab);

    // x ticks on whole clock hours since midnight
    const spanH = (tMax - tMin) / 3600;
    const stepH = spanH > 16 ? 4 : spanH > 8 ? 2 : 1;
    const firstH = Math.ceil((tMin - DAY_START) / 3600 / stepH) * stepH;
    for (let h = firstH; DAY_START + h * 3600 <= tMax + 1; h += stepH) {
      const tt = DAY_START + h * 3600;
      g.append(svg("line", { x1: x(tt), x2: x(tt), y1: H - B, y2: H - B + 4, stroke: "var(--rule-2)", "stroke-width": 1 }));
      const lab = svg("text", { x: x(tt), y: H - B + 20, class: "ax", "text-anchor": "middle" });
      lab.textContent = h.toString().padStart(2, "0") + ":00";
      g.append(lab);
    }
    g.append(svg("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: "var(--rule-2)", "stroke-width": 1 }));

    // the traces; the part above the threshold is drawn again in the alert colour
    live.forEach((d) => {
      const tr = d.trace;
      const pt = (i) => [x(tr.t0 + i * tr.dt), y(tr.v[i] / 1000)];
      let path = "";
      for (let i = 0; i < tr.v.length; i++) {
        const [px, py] = pt(i);
        path += (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1);
      }
      g.append(svg("path", { d: path, fill: "none", stroke: d.color,
                             "stroke-width": d.strong ? 2 : 1.4, "stroke-linejoin": "round",
                             "stroke-dasharray": d.dash ? "5 4" : "0",
                             opacity: d.dim ? 0.55 : 1 }));
      if (d.strong) {
        let hot = "", open = false;
        for (let i = 0; i < tr.v.length; i++) {
          if (tr.v[i] / 1000 > thr) {
            const [px, py] = pt(i);
            hot += (open ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1);
            open = true;
          } else { open = false; }
        }
        if (hot) g.append(svg("path", { d: hot, fill: "none", stroke: "var(--critical)", "stroke-width": 2.4 }));
      }
    });

    // where the failure was declared
    if (opts.failTs) {
      g.append(svg("line", { x1: x(opts.failTs), x2: x(opts.failTs), y1: T, y2: H - B,
                             stroke: "var(--critical)", "stroke-width": 1.6 }));
      const lab = svg("text", { x: x(opts.failTs) + 5, y: H - B - 6, class: "ax", fill: "var(--critical)" });
      lab.textContent = "failure " + clock(opts.failTs);
      g.append(lab);
    }

    // crosshair readout, single-trace only
    const readout = el("p", "readout", opts.readoutHint || "");
    if (live.length === 1) {
      const tr = live[0].trace;
      const cross = svg("line", { x1: 0, x2: 0, y1: T, y2: H - B, stroke: "var(--ink-3)",
                                  "stroke-width": 1, opacity: 0 });
      const dot = svg("circle", { r: 4, fill: live[0].color, stroke: "var(--panel)", "stroke-width": 2, opacity: 0 });
      g.append(cross); g.append(dot);
      const hit = svg("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" });
      hit.addEventListener("mousemove", (ev) => {
        const box = g.getBoundingClientRect();
        const px = (ev.clientX - box.left) / box.width * W;
        const at = tMin + (px - L) / (W - L - R) * (tMax - tMin);
        const i = Math.round((at - tr.t0) / tr.dt);
        if (i < 0 || i >= tr.v.length) {
          cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0);
          readout.textContent = "";
          return;
        }
        const tt = tr.t0 + i * tr.dt, vv = tr.v[i] / 1000;
        cross.setAttribute("x1", x(tt)); cross.setAttribute("x2", x(tt)); cross.setAttribute("opacity", 1);
        dot.setAttribute("cx", x(tt)); dot.setAttribute("cy", y(vv)); dot.setAttribute("opacity", 1);
        readout.textContent = clock(tt) + " (t = " + int(tt) + " s) \u00b7 index "
          + vv.toFixed(3) + (vv > thr ? " \u2014 above hardiness threshold" : "");
      });
      hit.addEventListener("mouseleave", () => {
        cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0);
        readout.textContent = opts.readoutHint || "";
      });
      g.append(hit);
    }

    add(wrap, g, readout);
    return wrap;
  }

    if (!str) return [];
    return String(str).split(";").map((s) => s.trim()).filter(Boolean).map((s) => {
      const m = s.match(/^(.*)\s\(([+-][\d.]+)\)$/);
      return m ? { m: m[1], z: parseFloat(m[2]) } : { m: s.replace(/\s[\^v]$/, ""), z: null, d: s.endsWith("^") ? "up" : "down" };
    });
