  /* ================= PATTERNS ================= */
  // Regularities in the verdict grid, computed from the payload so they track every rebuild:
  // which events decide the outcome on their own, what each side of the market adds,
  // where a compound event fails although neither component does, and how timing splits.
  // how the notebook's failure_mode categories are labelled on the patterns page
  const MODE_LABEL = { "not-served dominated": "rides_not_served", "demand-driven": "passengers_cancel",
                       "cancellation dominated": "passengers_cancel", "mixed": "mixed" };

  function patternStats() {
    // Under a prevention strategy the grid is only what that strategy was run on: events
    // and personalities with no run are left out of every count below rather than being
    // silently read as passing. Without a strategy these are the full lists.
    const SC = STRAT ? M.scenarios.filter((x) => M.personalities.some((p) => isRun(x, p)))
                     : M.scenarios;
    const PE = STRAT ? M.personalities.filter((p) => SC.some((x) => isRun(x, p)))
                     : M.personalities;
    const verdict = (s, p) => blOf(gridCell(s + "|" + p)).failure === true;
    const failTs = (s, p) => blOf(gridCell(s + "|" + p)).failure_timestamp;
    const events = SC.filter((x) => x !== "normal");
    const single = events.filter((x) => !M.compound.includes(x));
    const compound = events.filter((x) => M.compound.includes(x));
    const withDrivers = PE.filter((x) => PRETTY[x][1] === "Drivers");
    const noDrivers = PE.filter((x) => PRETTY[x][1] !== "Drivers");
    const nFailIn = (ss, ps) => ss.reduce((a, x) => a + ps.filter((y) => verdict(x, y)).length, 0);
    const median = (arr) => { const l = arr.slice().sort((a, b) => a - b); return l.length ? l[Math.floor((l.length - 1) / 2)] : null; };

    // event tiers
    const always = events.filter((x) => G().scenarios[x].nFail === G().scenarios[x].n);
    const never = events.filter((x) => G().scenarios[x].nFail === 0);
    const depends = events.filter((x) => !always.includes(x) && !never.includes(x));

    // driver side: same passenger type, general -> Drivers personality
    const driverPairs = noDrivers.map((a) => [a, PE.find((b) => PRETTY[b][1] === "Drivers" && PRETTY[b][0] === PRETTY[a][0])]).filter((x) => x[1]);
    const driverFlips = driverPairs.map(([a, b]) => ({ a, b,
      broken: events.filter((x) => !verdict(x, a) && verdict(x, b)),
      rescued: events.filter((x) => verdict(x, a) && !verdict(x, b)) }));
    const brokenCount = {}; driverFlips.forEach((f) => f.broken.forEach((x) => { brokenCount[x] = (brokenCount[x] || 0) + 1; }));
    const driverConsistent = Object.entries(brokenCount).filter(([, k]) => k >= Math.ceil(driverPairs.length * 0.75)).map(([x]) => x);

    // passenger side: same driver setting, general passengers -> a passenger personality
    const passengerTypes = [...new Set(PE.map((p) => PRETTY[p][0]))].filter((t) => t !== "General");
    const passengerFlips = [];
    [["General", "general drivers"], ["Drivers", "drivers with a personality"]].forEach(([drv, drvLabelTxt]) => {
      const ref = PE.find((p) => PRETTY[p][0] === "General" && PRETTY[p][1] === drv);
      passengerTypes.forEach((t) => {
        const p = PE.find((q) => PRETTY[q][0] === t && PRETTY[q][1] === drv);
        if (!ref || !p) return;
        passengerFlips.push({ t, drv, drvLabelTxt, ref, p,
          broken: events.filter((x) => !verdict(x, ref) && verdict(x, p)),
          rescued: events.filter((x) => verdict(x, ref) && !verdict(x, p)) });
      });
    });
    const refGen = PE.find((p) => PRETTY[p][0] === "General" && PRETTY[p][1] === "General");
    const passOnly = noDrivers.filter((p) => p !== refGen);
    // events where the reference personality survives but every passenger personality (general drivers) fails
    const passengerFragile = events.filter((x) => !verdict(x, refGen) && passOnly.length && passOnly.every((p) => verdict(x, p)));
    const byPassengerType = passengerTypes.concat(["General"]).map((t) => {
      const ps = PE.filter((p) => PRETTY[p][0] === t);
      return { t, fails: nFailIn(events, ps), n: events.length * ps.length };
    });

    // personalities ranked
    const ranked = PE.map((p) => ({ p, fails: nFailIn(events, [p]) })).sort((a, b) => a.fails - b.fails);

    // compounds against their parts
    const emergent = [], masked = []; let additive = 0, total = 0;
    compound.forEach((x) => {
      const parts = G().scenarios[x].components;
      if (!parts.every((c) => SC.includes(c))) return;   // its parts are not in this grid
      PE.forEach((p) => {
        const anyPart = parts.some((c) => verdict(c, p)); const whole = verdict(x, p); total++;
        if (anyPart === whole) additive++; else if (whole) emergent.push([x, p]); else masked.push([x, p]);
      });
    });
    const emergentBy = {}; emergent.forEach(([x]) => { emergentBy[x] = (emergentBy[x] || 0) + 1; });
    const emergentWithDrivers = emergent.filter(([, p]) => PRETTY[p][1] === "Drivers").length;
    // which component the masked runs fail on their own
    const maskedOf = {}; masked.forEach(([x, p]) => G().scenarios[x].components.filter((c) => SC.includes(c) && verdict(c, p)).forEach((c) => { maskedOf[c] = (maskedOf[c] || 0) + 1; }));
    const maskedComponents = Object.entries(maskedOf).sort((a, b) => b[1] - a[1]).map(([c]) => c);
    // single events, by side
    const singleBySide = (ps) => single.map((x) => ({ s: x, n: ps.filter((p) => verdict(x, p)).length, of: ps.length })).filter((r) => r.n).sort((a, b) => b.n - a.n);
    const singleGeneral = singleBySide(noDrivers), singleDrivers = singleBySide(withDrivers);
    // failure mechanism by side
    const modeBySide = {};
    [["general drivers", noDrivers], ["Drivers personality", withDrivers]].forEach(([k, ps]) => {
      const m = {}; let n = 0;
      events.forEach((x) => ps.forEach((p) => { if (!verdict(x, p)) return; n++; const raw = gridCell(x + "|" + p).failure_mode; const lab = MODE_LABEL[raw] || raw; m[lab] = (m[lab] || 0) + 1; }));
      modeBySide[k] = { n, m };
    });
    const emergentTop = Object.entries(emergentBy).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([x]) => x);
    const maskedWithDrivers = masked.filter(([, p]) => PRETTY[p][1] === "Drivers").length;

    // timing and failure mode
    const timing = events.map((x) => {
      const fails = PE.filter((p) => verdict(x, p));
      const lags = fails.map((p) => failTs(x, p)).filter((t) => t != null).map((t) => (t - 79200) / 60);
      const modes = {}; fails.forEach((p) => { const m = gridCell(x + "|" + p).failure_mode; const lab = MODE_LABEL[m] || m || "\u2013"; modes[lab] = (modes[lab] || 0) + 1; });
      return { s: x, n: fails.length, med: median(lags), lo: Math.min(...lags), hi: Math.max(...lags),
               mode: Object.entries(modes).sort((a, b) => b[1] - a[1]).map(([m, k]) => m + " (" + k + ")").join(", "), modes };
    }).filter((r) => r.n).sort((a, b) => a.med - b.med);
    const persMed = PE.map((p) => median(events.filter((x) => verdict(x, p)).map((x) => (failTs(x, p) - 79200) / 60))).filter((x) => x != null);
    const modeTotals = {}; timing.forEach((r) => Object.entries(r.modes).forEach(([m, k]) => { modeTotals[m] = (modeTotals[m] || 0) + k; }));

    return { SC, PE, verdict, events, single, compound, withDrivers, noDrivers, nFailIn, always, never, depends,
             driverPairs, driverFlips, driverConsistent, passengerTypes, passengerFlips, passengerFragile, byPassengerType,
             refGen, ranked, emergent, masked, additive, total, emergentTop, maskedWithDrivers, emergentWithDrivers, maskedComponents,
             singleGeneral, singleDrivers, modeBySide, timing, persMed, modeTotals };
  }

  /* ================= patterns of one prevention strategy =================
     A strategy is not described by the regularities of the verdict grid but by what it did
     to the runs it was applied to: which failures it removed, which it left failing, and
     which metrics it moved to get there. */
  function viewPreventionPatterns(k) {
    const v = $("view");
    v.innerHTML = "";
    const P = PREV[k], label = P.label, low = label.toLowerCase();
    const cells = Object.keys(P.cells).map((key) => P.cells[key]);
    const by = (o) => cells.filter((c) => c.outcome === o);
    const prevented = by("prevented"), fails = by("still fails");
    const rescued = prevented;
    const mean = (xs) => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
    const nums = (list, f) => list.map((c) => c[f]).filter((x) => x != null);
    const E = P.effects || {};
    const sc = (c) => c.scenario, pe = (c) => c.personality;
    const uniq = (xs) => [...new Set(xs)];
    const listOf = (xs, f) => uniq(xs.map(f)).map((x) => f === sc ? sname(x) : pname(x)).join(", ");

    v.append(strategyNote());

    const stats = el("section", "stats");
    [[prevented.length, "failures removed"], [fails.length, "failures untouched"],
     [Math.round(prevented.length / (cells.length || 1) * 100) + "%", "of its runs prevented"]
    ].forEach(([val, kk]) => {
      const d = el("div", "stat");
      add(d, el("div", "v", String(val)), el("div", "k", kk));
      stats.append(d);
    });
    v.append(stats);

    /* --- where it works --- */
    const W = panel("Where it works", "The runs whose HCS failure it removed, and the ones it left failing.");
    W.body.append(figs([
      [sgn(mean(nums(cells, "d_fr_mean_event")), 3), "mean change of the index during the event"],
      [sgn(mean(nums(cells, "d_fr_peak")), 3), "mean change of the peak index"],
      [sgn(mean(nums(cells, "d_minutes_above_threshold")), 0) + " min", "mean change of time above the threshold"],
      [fails.length ? sgn(mean(nums(fails, "shift_min")), 0) + " min" : "\u2013", "mean shift of the failures it leaves"]
    ]));
    W.body.append(el("div", "hr"));
    const mk = (list, cls) => {
      const w = el("div", "minicells");
      list.forEach((c) => {
        const b = el("button", cls); b.type = "button";
        add(b, el("span", "b", cls === "fail" ? "\u2715" : "\u25c6"),
               el("span", null, sname(c.scenario) + " \u00b7 " + pname(c.personality)));
        b.addEventListener("click", () => go("/x/" + k + "/" + c.scenario + "/" + c.personality));
        w.append(b);
      });
      return w;
    };
    if (prevented.length) {
      add(W.body, el("h3", null, "Failures it removed"), mk(prevented, "pass2"));
    }
    if (fails.length) {
      add(W.body, el("h3", null, "Failures it did not touch"), mk(fails, "fail"));
    }
    v.append(W.panel);

    /* --- which metrics it moves --- */
    if ((E.moved || []).length) {
      const M = panel("Which metrics the strategy moves",
        "Event-window level with the strategy minus the level without it, in <b>robust z</b>, averaged over its " +
        cells.length + " runs. This is what the strategy changes in the system, whether or not that saves the run.");
      const bl = el("div", "blocks");
      const m1 = el("div", "block");
      add(m1, el("h3", null, "Most moved metrics"));
      m1.append(metricTable(E.moved, [
        ["Metric", (r) => el("td", "ml", r.m)],
        ["Family", (r) => el("td", "fam", FAMILY(r.f))],
        ["Change", (r) => el("td", "n " + (r.dz >= 0 ? "up" : "down"), sgn(r.dz, 2) + "\u03c3"), true]
      ]));
      bl.append(m1);
      if ((E.families || []).length) {
        const m2 = el("div", "block");
        add(m2, el("h3", null, "Which part of the system it touches"),
               el("p", "sub", "Mean |z| of the change, per metric family."));
        m2.append(magRows(E.families.map((f) => [FAMILY(f.f), f.v]), "\u03c3", (fam, val) =>
          "The " + fam + " metrics moved on average " + num(val, 2) + "\u03c3 when " + low + " was applied."));
        bl.append(m2);
      }
      M.body.append(bl);
      v.append(M.panel);
    }

    /* --- what separates a prevented failure from a failure --- */
    if ((E.separating || []).length && rescued.length && fails.length) {
      const R = panel("What separates a prevented failure from a run it cannot save",
        "The same change, split between the " + rescued.length + " runs it prevented and the " +
        fails.length + " it did not: the metrics whose response differs most are where the prevention happens.");
      R.body.append(metricTable(E.separating, [
        ["Metric", (r) => el("td", "ml", r.m)],
        ["Family", (r) => el("td", "fam", FAMILY(r.f))],
        ["Prevented", (r) => el("td", "n " + (r.prevented >= 0 ? "up" : "down"), sgn(r.prevented, 2) + "\u03c3"), true],
        ["Still fails", (r) => el("td", "n " + (r.stillFails >= 0 ? "up" : "down"), sgn(r.stillFails, 2) + "\u03c3"), true],
        ["Gap", (r) => el("td", "n " + (r.gap >= 0 ? "up" : "down"), sgn(r.gap, 2) + "\u03c3"), true]
      ]));
      v.append(R.panel);
    }

  }

  function viewPatterns() {
    if (STRAT) return viewPreventionPatterns(STRAT);
    const v = $("view");
    v.innerHTML = "";
    const S = patternStats();
    const pct = (k, n) => n ? Math.round(k / n * 100) + "%" : "\u2013";
    const list = (xs, f) => xs.map(f || sname).join(", ");
    const link = (label, href, cls) => { const b = el("button", cls || null, label); b.type = "button"; b.addEventListener("click", () => go(href)); return b; };
    const chipList = (items, mk) => { const w = el("div", "minicells"); items.forEach((x) => w.append(mk(x))); return w; };
    const scenChip = (x, fail) => { const b = link("", "/s/" + x); b.classList.add(fail === true ? "fail" : fail === false ? "pass2" : "warn"); add(b, el("span", "b", fail === true ? "\u2715" : fail === false ? "\u2713" : "\u00b1"), el("span", null, sname(x) + " " + G().scenarios[x].nFail + "/" + G().scenarios[x].n)); return b; };
    const cellChip = (x) => { const f = S.verdict(x[0], x[1]); const b = link("", (STRAT ? "/x/" + STRAT + "/" : "/d/") + x[0] + "/" + x[1]); b.classList.add(f ? "fail" : "pass2"); add(b, el("span", "b", f ? "\u2715" : "\u2713"), el("span", null, sname(x[0]) + " \u00b7 " + pname(x[1]))); return b; };
    const flipRows = (rows, who) => {
      const flip = el("div", "flip");
      rows.forEach((r) => {
        const row = el("div", "row"); add(row, el("div", "who", who(r)));
        const lst = el("div", "lst");
        if (r.broken.length) { lst.append(el("span", "k", "breaks")); r.broken.forEach((x) => lst.append(link(sname(x), "/d/" + x + "/" + r.p_or_b(r), "fail"))); }
        if (r.rescued.length) { lst.append(el("span", "k", "rescues")); r.rescued.forEach((x) => lst.append(link(sname(x), "/d/" + x + "/" + r.p_or_b(r), "pass2"))); }
        if (!r.broken.length && !r.rescued.length) lst.append(el("span", "k", "no change"));
        row.append(lst); flip.append(row);
      });
      const wrap = el("div", "minicells"); wrap.style.display = "block"; wrap.append(flip); return wrap;
    };
    const b = (t) => "<b>" + t + "</b>";

    add(v, el("p", "lede", "The verdict grid read by row, by column, and against the components of each compound event: what decides whether a run fails."));

    /* ---- summary ---- */
    const brokenD = S.driverFlips.reduce((a, f) => a + f.broken.length, 0), rescuedD = S.driverFlips.reduce((a, f) => a + f.rescued.length, 0);
    const pf = S.passengerFlips.filter((f) => f.drv === "General");
    const brokenP = pf.reduce((a, f) => a + f.broken.length, 0), rescuedP = pf.reduce((a, f) => a + f.rescued.length, 0);
    const fragilePT = S.byPassengerType.slice().sort((a, c) => c.fails - a.fails)[0], robustPT = S.byPassengerType.slice().sort((a, c) => a.fails - c.fails)[0];
    const best = S.ranked[0], worst = S.ranked[S.ranked.length - 1];
    const fastest = S.timing[0], slowest = S.timing[S.timing.length - 1];
    const modesSorted = Object.entries(S.modeTotals).sort((a, c) => c[1] - a[1]); const nFailTot = modesSorted.reduce((a, [, k]) => a + k, 0);
    const K = panel("In short");
    const ul = el("ul", "summary");
    const li = (html) => { const l = el("li"); l.innerHTML = html; ul.append(l); };
    li(b("The event comes first.") + " " + S.always.length + " of the " + S.events.length + " events fail with every personality (" + list(S.always) + "), " +
       S.never.length + (S.never.length === 1 ? " never fails" : " never fail") + (S.never.length ? " (" + list(S.never) + ")" : "") + ". In the other " + S.depends.length + " the personality decides, and that is where the patterns below live.");
    li(b("Compound events are the danger zone:") + " they fail " + pct(S.nFailIn(S.compound, S.PE), S.compound.length * S.PE.length) + " of the time, against " +
       pct(S.nFailIn(S.single, S.PE), S.single.length * S.PE.length) + " for single events.");
    li(b("The driver side is the riskier one to give a personality.") + " Switching the drivers from general to the Drivers personality turns " + brokenD + " runs into failures and rescues " + rescuedD +
       (S.driverConsistent.length ? "; it breaks " + list(S.driverConsistent) + " for " + (S.driverConsistent.length === 1 ? "almost every" : "almost every") + " passenger type." : "."));
    li(b("Passenger personalities matter mostly in the marginal compounds.") + " With general drivers, giving the passengers a personality turns " + brokenP + " runs into failures and rescues " + rescuedP +
       (S.passengerFragile.length ? "; in " + list(S.passengerFragile) + " every passenger personality fails while general passengers survive." : ".") +
       " Over both driver settings the most fragile passenger type is " + b(fragilePT.t) + " (" + fragilePT.fails + " of " + fragilePT.n + " runs), the most robust " + b(robustPT.t) + " (" + robustPT.fails + " of " + robustPT.n + ").");
    li(b("Most robust personality: ") + pname(best.p) + " (" + best.fails + " of " + S.events.length + " events fail). " + b("Most fragile: ") + pname(worst.p) + " (" + worst.fails + " of " + S.events.length + ").");
    li(b("Combinations are not just the sum of their parts.") + " " + S.emergent.length + " compound runs fail although neither event does on its own" + (S.emergentTop.length ? " (mostly " + list(S.emergentTop) + ")" : "") +
       ", and " + S.masked.length + " survive although one of the events fails alone.");
    li(b("The two sides fail in opposite ways.") + " " + (S.maskedWithDrivers === S.masked.length ? "All " : S.maskedWithDrivers + " of the ") + S.masked.length + " survivors carry the Drivers personality, and the events they shrug off are " + list(S.maskedComponents) + "; " +
       (S.emergent.length - S.emergentWithDrivers) + " of the " + S.emergent.length + " emergent failures have general drivers. Personality-driven drivers break on single demand events and are shielded in combinations; general drivers survive the single events and get surprised by the combinations.");
    li(b("Single events barely touch the general-driver side.") + " With general drivers the only single event that fails is " + list(S.singleGeneral.map((r) => r.s)) + "; with the Drivers personality " +
       S.singleDrivers.map((r) => sname(r.s) + " (" + r.n + " of " + r.of + ")").join(", ") + " fail as well.");
    if (fastest && slowest) li(b("The event sets the clock, the personality sets the verdict.") + " " + sname(fastest.s) + " fails first (median " + Math.round(fastest.med) + " min after the injection), " + sname(slowest.s) + " last (" + Math.round(slowest.med) + " min)" +
       (S.persMed.length ? ", while across personalities the median lag only ranges " + Math.round(Math.min(...S.persMed)) + "\u2013" + Math.round(Math.max(...S.persMed)) + " min." : "."));
    const condLead = S.PE.map((p) => { const cs = (G().personalities[p].conditions || []); if (!cs.length) return null;
      const c = cs.find((x) => x.specific) || cs[0]; const n = c.nFail + c.nPass;
      return pname(p) + " when " + condPhrase(c) + " (" + Math.round(c.acc * n) + " of " + n + " runs)"; }).filter(Boolean);
    if (condLead.length) li(b("Each personality has its own failure condition.") + " Reading the event-window levels of the failing against the passing runs: " + condLead.join("; ") + ".");
    if (modesSorted.length) li(b("What breaks:") + " " + modesSorted.map(([m, k]) => k + " of " + nFailTot + " failures are " + m + "-driven").join(", ") + ". " +
       Object.entries(S.modeBySide).map(([side, r]) => "With " + side + ": " + Object.entries(r.m).sort((a, c) => c[1] - a[1]).map(([m, k]) => k + " " + m).join(", ") + " (of " + r.n + ")").join("; ") + ".");
    K.body.append(ul);

    /* ---- detail ---- */
    const P = panel("Patterns in the failures");
    const body = el("div", "pat");

    // 1. tiers
    const b1 = el("div");
    add(b1, el("h3", null, "The event sets the tier, the personality decides inside it"),
        el("p", "sub", "Each event is run with all " + S.PE.length + " personalities. Some fail regardless of who is in the system, some never fail, and in the rest the personality makes the difference."));
    const tiers = el("div", "tiers");
    [["fails with every personality", S.always, true], ["does not fail", S.never, false], ["depends on the personality", S.depends, null]].forEach(([t, lst, f]) => {
      const d = el("div", "tier"); add(d, el("div", "t", t + " \u00b7 "), chipList(lst, (x) => scenChip(x, f)));
      d.querySelector(".t").append(el("b", null, String(lst.length))); tiers.append(d);
    });
    b1.append(tiers);
    body.append(b1);

    // 2. rates
    const b2 = el("div");
    add(b2, el("h3", null, "Where the failures concentrate"), el("p", "sub", "Failure rate by kind of event and by side of the market that carries a personality."));
    b2.append(figs([
      [pct(S.nFailIn(S.single, S.PE), S.single.length * S.PE.length), "single events (" + S.nFailIn(S.single, S.PE) + " of " + S.single.length * S.PE.length + " runs)"],
      [pct(S.nFailIn(S.compound, S.PE), S.compound.length * S.PE.length), "compound events (" + S.nFailIn(S.compound, S.PE) + " of " + S.compound.length * S.PE.length + ")"],
      [pct(S.nFailIn(S.events, S.noDrivers), S.events.length * S.noDrivers.length), "general drivers (" + S.nFailIn(S.events, S.noDrivers) + " of " + S.events.length * S.noDrivers.length + ")"],
      [pct(S.nFailIn(S.events, S.withDrivers), S.events.length * S.withDrivers.length), "drivers with a personality (" + S.nFailIn(S.events, S.withDrivers) + " of " + S.events.length * S.withDrivers.length + ")"]
    ]));
    body.append(b2);

    // 3. driver side
    const b3 = el("div");
    add(b3, el("h3", null, "What giving the drivers a personality changes"),
        el("p", "sub", "Same passenger type, same event, drivers switched from the general to the Drivers personality: " + brokenD + " runs turn into failures, " + rescuedD + " are rescued. " +
          "On single events the difference is stark: with general drivers only " + list(S.singleGeneral.map((r) => r.s)) + " fails, with the Drivers personality " + list(S.singleDrivers.map((r) => r.s)) + " do."));
    b3.append(flipRows(S.driverFlips.map((f) => ({ ...f, p_or_b: () => f.b })), (f) => PRETTY[f.a][0] + " passengers: General \u2192 Drivers"));
    body.append(b3);

    // 4. passenger side
    const b4 = el("div");
    add(b4, el("h3", null, "What giving the passengers a personality changes"),
        el("p", "sub", "Same driver setting, same event, passengers switched from general to a personality. Shown for both driver settings, so the passenger effect can be read on its own and on top of the Drivers personality."));
    b4.append(figs(S.byPassengerType.map((r) => [pct(r.fails, r.n), r.t + " passengers (" + r.fails + " of " + r.n + " runs)"])));
    b4.append(flipRows(S.passengerFlips.map((f) => ({ ...f, p_or_b: () => f.p })), (f) => f.t + " passengers, with " + f.drvLabelTxt + ": General \u2192 " + f.t));
    body.append(b4);

    // 5. compounds against parts
    const b5 = el("div");
    add(b5, el("h3", null, "Compound events against their parts"),
        el("p", "sub", "For " + S.additive + " of " + S.total + " compound runs the verdict is simply \u201cfails if either event fails on its own\u201d. The rest are emergent, and they split by side: " +
          (S.emergent.length - S.emergentWithDrivers) + " of the " + S.emergent.length + " emergent failures have general drivers, while all " + S.masked.length + " survivors carry the Drivers personality and shrug off " + list(S.maskedComponents) + "."));
    const g5 = el("div", "blocks");
    const e1 = el("div", "block"); add(e1, el("h3", null, "Fails, although neither event does on its own \u00b7 " + S.emergent.length), el("p", "sub", "The combination breaks a configuration that survives each shock separately."), chipList(S.emergent, cellChip));
    const e2 = el("div", "block"); add(e2, el("h3", null, "Survives, although one event fails on its own \u00b7 " + S.masked.length), el("p", "sub", "The second shock masks the failure the first one causes alone."), chipList(S.masked, cellChip));
    add(g5, e1, e2); b5.append(g5);
    body.append(b5);

    // 6. timing and mode
    const b6 = el("div");
    add(b6, el("h3", null, "When they fail, and through what"),
        el("p", "sub", "Minutes between the event injection and the HCS failure, over the failing runs of each event, with what drove the spike in those runs."));
    const sc6 = el("div", "tscroll");
    sc6.append(metricTable(S.timing, [
      ["Event", (r) => { const td = el("td", "ml"); td.append(link(sname(r.s), "/s/" + r.s, "lnk")); return td; }],
      ["Failing runs", (r) => el("td", "n", r.n + " / " + S.PE.length), true],
      ["Median lag", (r) => el("td", "n", Math.round(r.med) + " min"), true],
      ["Range", (r) => el("td", "n muted", Math.round(r.lo) + "\u2013" + Math.round(r.hi) + " min"), true],
      ["Driven by", (r) => el("td", null, r.mode)]
    ]));
    b6.append(sc6);
    body.append(b6);

    // 7. conditions per personality
    const withCond = S.PE.filter((p) => (G().personalities[p].conditions || []).length);
    if (withCond.length) {
      const b7 = el("div");
      add(b7, el("h3", null, "Under what conditions each personality fails"),
          el("p", "sub", "For each personality, the metrics whose event-window level best separates its failing runs from its passing ones, and the threshold that splits them."));
      const cw = el("div", "cond");
      withCond.forEach((p) => {
        const info = G().personalities[p]; const items = info.conditions; const n = items[0].nFail + items[0].nPass;
        const box = el("div");
        const who = el("div", "who"); const pb = el("button", null, pname(p)); pb.type = "button"; pb.addEventListener("click", () => go("/p/" + p));
        const h4 = el("h4"); h4.append(pb); add(who, h4, el("span", "n", items[0].nFail + " failing / " + items[0].nPass + " passing runs"));
        add(box, who, conditionsTable(items, n)); cw.append(box);
      });
      b7.append(cw);
      body.append(b7);
    }

    // 8. tolerance to the shared conditions
    if ((M.tolerance || []).length) {
      const b8 = el("div");
      const cols = S.PE.filter((p) => M.tolerance.some((t) => t.cuts[p] != null));
      add(b8, el("h3", null, "Same condition, different tolerance"),
          el("p", "sub", "This table takes the conditions that matter for most personalities and shows, for every personality, the failing threshold on each of them: how much of that condition a personality can absorb before it fails. Lowest values mean less tolerance."));
      const sc8 = el("div", "tscroll");
      sc8.append(metricTable(M.tolerance, [["Condition", (r) => el("td", "ml", r.m + " " + (Object.values(r.dirs)[0] || ""))]]
        .concat(cols.map((p) => [PRETTY[p][0] + " \u00d7 " + PRETTY[p][1], (r) => {
          const v = r.cuts[p]; return el("td", "tol", v == null ? "\u2013" : num(v, 2)); }, true]))));
      b8.append(sc8);
      body.append(b8);
    }

    P.body.append(body);
    v.append(P.panel);
    v.append(K.panel);
    v.append(glossaryPanel());
  }

  /* ================= CELL ================= */
  function viewCell(s, p) {
    // this view is the run without prevention, whatever grid is selected elsewhere
    const c = cellOf.get(s + "|" + p);
    const v = $("view");
    v.innerHTML = "";
    const failed = blOf(c).failure === true;

    const banner = el("div", "verdict-banner " + (failed ? "fail" : "pass"));
    const txt = el("div");
    const mins = failed && blOf(c).failure_timestamp != null ? Math.round((blOf(c).failure_timestamp - 79200) / 60) : null;
    txt.innerHTML = failed
      ? "<p><strong>" + sname(s) + " \u00b7 " + pname(p) + "</strong> was declared a HCS failure at <span class='mono'>t = " +
        int(blOf(c).failure_timestamp) + " s</span>" + (mins != null ? ", " + mins + " minutes after the event was injected" : "") + "</p>"
      : "<p><strong>" + sname(s) + " \u00b7 " + pname(p) + "</strong> passed: the index never went out of range on the three dimensions together" +
        (blOf(c).n_spikes > 0 ? ", though it did break the hardiness threshold " + blOf(c).n_spikes + " time" + (blOf(c).n_spikes > 1 ? "s" : "") + "." : ".") + "</p>";
    add(banner, el("div", "vg", failed ? "\u2715 FAIL" : "\u2713 PASS"), txt);
    v.append(banner);

    /* --- the index over the run --- */
    const T0 = panel("The failed_requests index over the run");
    T0.body.append(indexChart(
      [{ trace: c.trace, color: "var(--r4)", strong: true,
         cutAt: failed ? blOf(c).failure_timestamp : null }],
      { event: s === "normal" ? null : G().scenarios[s].window,
        failTs: failed ? blOf(c).failure_timestamp : null,
        xMin: DAY_START, xMax: AXIS_END,
        readoutHint: "Hover the chart to read off a value." }));
    v.append(T0.panel);

    /* --- intrinsic characteristics --- */
    const A = panel("What this run does");
    A.body.append(figs([
      [num(c.fr_mean_event, 3), "mean failed_requests index during the event"],
      [num(c.fr_mean, 3), "mean failed_requests index over the whole run"],
      [num(c.fr_peak, 2), "peak failed_requests index (maximum)"],
      [blOf(c).n_spikes, "spike episodes"],
      [Math.round(blOf(c).spike_minutes) + " min", "total time in spike"],
      [Math.round(blOf(c).spike_minutes_in_event) + " min", "of that, in the event"]
    ]));
    const bl = el("div", "blocks");
    add(bl, attributionBlock(c), decompBlock(c));
    if (!failed) {
      bl.append(splitBlock("What was failing anyway",
        "Here are the two failure metrics at their real levels over the event window, "
        + "and how the failures divide between them.",
        c.window));
    }
    if (c.fr_component_residual != null) {
      const cr = el("div", "block");
      const sup = c.fr_component_residual > 0;
      add(cr, el("h3", null, "Against the sum of its parts"),
             el("p", "sub", "The two events separately predict " + num(c.fr_expected_from_components, 3) +
                "; injected together they deliver " + num(c.fr_expected_from_components + c.fr_component_residual, 3) + "."));
      cr.append(signedRows([
        ["Expected", c.fr_expected_from_components],
        ["Observed", c.fr_expected_from_components + c.fr_component_residual]
      ], ["Residual", c.fr_component_residual]));
      add(cr, el("p", "sub", sup
        ? "Super-additive: the pair costs more than the two shocks separately."
        : "Sub-additive: the two shocks partly cancel."));
      bl.append(cr);
    }
    if (bl.children.length) {
      A.body.append(el("div", "hr"));
      A.body.append(bl);
    }
    v.append(A.panel);

    /* --- why it failed --- */
    if (failed && blOf(c).failSpike) {
      const fs = blOf(c).failSpike;
      const B = panel("Why it failed", "The spike episode the failure timestamp falls inside, and what moved during it.");
      const why = el("div");
      const drv = Math.abs(fs.ns || 0) >= Math.abs(fs.ca || 0) ? "rides_not_served" : "passengers_cancel";
      why.innerHTML = "<p style='font-size:13.5px;color:var(--ink-2)'>The failure sits inside a <strong>" +
        num(fs.dur, 0) + "-minute</strong> spike running from <span class='mono'>" + int(fs.start) + " s</span> to <span class='mono'>" +
        int(fs.end) + " s</span>. The index averaged <span class='mono'>" + num(fs.mean, 3) +
        "</span> across it and peaked at <span class='mono'>" + num(fs.peak, 2) +
        "</span>. <strong class='mono'>" + drv + "</strong> accounted for most of the climb.</p>";
      B.body.append(why);
      B.body.append(el("div", "hr"));
      // All three indices the verdict rests on, each beside its own threshold.
      B.body.append(figs([
        [num(fs.mean, 3), "mean failed_requests index across the spike"],
        [num(fs.peak, 3), "hardiness peak across the spike"],
        [TH().p99_h.toFixed(3), "hardiness threshold"],
        [fs.conPeak == null ? "\u2013" : num(fs.conPeak, 3), "consistency peak across the spike"],
        [TH().p99_c.toFixed(3), "consistency threshold"],
        [fs.resRun == null ? "\u2013" : int(fs.resRun), "resilience run, timestamps"],
        [int(TH().p99_r), "resilience threshold, timestamps"],
        [num(fs.dur, 0) + " min", "spike duration"],
        [(POSITION[fs.pos] || [fs.pos, "timing relative to the event"])[0],
         (POSITION[fs.pos] || [fs.pos, "timing relative to the event"])[1]]
      ]));

      if (fs.nsIn != null) {
        B.body.append(el("div", "hr"));
        const d2 = el("div", "block");
        B.body.append(splitBlock("What was actually failing",
          "The two failure metrics at their real levels during the spike, and how the failures divide "
          + "between them (this is the level, not the rise).",
          fs));
      }
      v.append(B.panel);
    }

    /* --- most affected metrics --- */
    if (blOf(c).affected && blOf(c).affected.length) {
      const C2 = panel("Most affected metrics",
        "Measured inside the spike, in <b>robust z</b> units. \u201cvs outside event window\u201d compares against this same "
        + "run away from the shock. \u201cvs baseline reference\u201d is the gap from the baseline normal run used for threshold at the same clock time.");
      const C2scroll = el("div", "tscroll");
      C2scroll.append(metricTable(blOf(c).affected, [
        ["Metric", (r) => el("td", "ml", r.m)],
        ["Family", (r) => el("td", "fam", FAMILY(r.f))],
        ["In spike", (r) => el("td", "n", num(r.lvl, 2)), true],
        ["Outside event", (r) => el("td", "n muted", num(r.base, 2)), true],
        ["vs outside event window", (r) => withTip(el("td", "n " + (r.dev >= 0 ? "up" : "down"), sgn(r.dev, 1) + "\u03c3"),
          zTip(r.m, r.dev, "inside the spike, against this same run outside the event window")), true],
        ["vs baseline reference", (r) => withTip(el("td", "n " + (r.ref >= 0 ? "up" : "down"), sgn(r.ref, 1) + "\u03c3"),
          zTip(r.m, r.ref, "inside the spike, against the baseline normal run at the same clock time")), true]
      ]));
      C2.body.append(C2scroll);
      v.append(C2.panel);
    }

    /* --- why: attribution of causes --- */
    const E = panel("Where those movements come from",
      "The same event-window split as above, applied metric by metric and ranked by <b>robust z</b>.");
    const cs = el("div", "causes");
    add(cs,
      causeList("Carried by the event", "Metrics the event moves regardless of who is in the system.", parseList(c.causes_scenario), "\u03c3",
                "because of the event alone"),
      causeList("Carried by the personality", "Metrics the personality moves regardless of the event.", parseList(c.causes_personality), "\u03c3",
                "because of the personality alone"),
      causeList("Carried by the interaction", "Metrics that move only for this pairing (emergent behavior).", parseList(c.causes_interaction), "\u03c3",
                "beyond what the event and the personality explain on their own"));
    if (cs.children.length) {
      E.body.append(cs);
      v.append(E.panel);
    }
    v.append(glossaryPanel());
  }

  /* ================= EVENT ================= */
  function viewScenario(s) {
    const info = G().scenarios[s];
    const v = $("view");
    v.innerHTML = "";

    const H = panel(sname(s), info.mechanism === "none" ? "The normal baseline run: no event is injected."

    H.body.append(figs([
      [blOfInfo(info).nFail + " / " + blOfInfo(info).n, "personalities failed"],
      [(blOfInfo(info).nFail / blOfInfo(info).n * 100).toFixed(0) + "%", "failure rate"],
      [num(info.meanIndex, 3), "mean failed_requests index during event, over its " + blOfInfo(info).n + " runs"],
      [num(info.peak, 2), "highest failed_requests index reached by any of them"],
      [num(blOfInfo(info).spikeMin, 0) + " min", "mean time in spike"],
      [sgn(info.effect, 3), "event effect on the failed_requests index"],
      [info.medianFailTs == null ? "\u2013" : int(info.medianFailTs) + " s", "median failure time"]

    B.body.append(miniCells(PE.map((p) => ({
      s: s, p: p, label: pname(p), fail: blOf(gridCell(s + "|" + p)).failure === true
    }))));

    add(B.body, el("h3", null, "All eight, over the run"),
                el("p", "sub", "One trace per personality, red where the run was declared a failure."));

      PE.map((p) => {
        const cc = gridCell(s + "|" + p);
        const bad = cc && blOf(cc).failure === true;
        return { trace: cc && cc.trace, color: bad ? "var(--critical)" : "var(--r3)",
                 strong: false, dim: !bad, cutAt: bad ? blOf(cc).failure_timestamp : null };
      }),
      { event: s === "normal" ? null : info.window, height: 260, xMin: DAY_START,
        xMax: AXIS_END }));
    const lgd = el("div", "legend");
    add(lgd, swatch("var(--critical)", "failed"), swatch("var(--r3)", "passed"));
    B.body.append(lgd);

    v.append(B.panel);

    // For the quiet run every event effect is zero by construction, so the panel is skipped.
    const C2 = (s === "normal" || STRAT) ? null : panel("What the event does to the system",

    if (C2) {
    const bl = el("div", "blocks");
    const m1 = el("div", "block");
    add(m1, el("h3", null, "Most moved metrics"), el("p", "sub", "Event-window level against the normal baseline."));

    m1.append(metricTable(info.topMetrics, [
      ["Metric", (r) => el("td", "ml", r.m)],
      ["Family", (r) => el("td", "fam", FAMILY(r.f))],
      ["Effect", (r) => withTip(el("td", "n " + (r.z >= 0 ? "up" : "down"), sgn(r.z, 1) + "\u03c3"), zTip(r.m, r.z, scenAgainst)), true]
    ]));
    bl.append(m1);
    const m2 = el("div", "block");
    add(m2, el("h3", null, "Which part of the system it disturbs"), el("p", "sub", "Mean |z| of the event effect per metric family."));
    m2.append(magRows(info.families.map((f) => [FAMILY(f.f), f.v]), "\u03c3", (fam, v) =>
      "The " + fam + " metrics moved on average " + num(v, 2) + "\u03c3 (robust standard deviations) away " + scenAgainst + "."));
    bl.append(m2);
    if (info.traits.length) {
      const m3 = el("div", "block");
      add(m3, el("h3", null, "Traits in play"), el("p", "sub", "Moved the same way for every one of the eight personalities."));
      m3.append(metricTable(info.traits, [
        ["Metric", (r) => el("td", "ml", r.m)],
        ["Mean z", (r) => withTip(el("td", "n " + (r.z >= 0 ? "up" : "down"), sgn(r.z, 1) + "\u03c3"), TRAIT_SCEN(r.m, r.z, r.d)), true],
        ["Dir", (r) => el("td", null, r.d === "up" ? "\u2191" : "\u2193")]
      ]));
      bl.append(m3);
    }
    C2.body.append(bl);
    v.append(C2.panel);
    }

    if (info.additivity) {
      const a = info.additivity;
      const D2 = panel("Against the sum of its parts",
        "Compared with " + info.components.map((x) => x.replace(/_/g, " ")).join(" and ") +
        " injected on their own, averaged over the eight personalities.");
      D2.body.append(signedRows([["Expected", a.expected], ["Observed", a.observed]], ["Residual", a.residual]));
      add(D2.body, el("p", "sub", a.superAdditive + " of " + a.n +
        " personalities show a super-additive response (that is, the combination costs more than the two shocks separately)."));
      v.append(D2.panel);
    }
    v.append(glossaryPanel());
  }

    bl.append(m2);

      add(D2.body, el("p", "sub", a.superAdditive + " of " + a.n +
        " events show a super-additive response (that is, the combination costs more than its two components separately)."));
      v.append(D2.panel);

    v.append(glossaryPanel());

  $("footer").innerHTML =
    "Failed_requests index and verdicts from <code>rq1-healthiness.ipynb</code> \u00b7 " +

  // Toggles the prior-work verdict column of the overview grid, the only place it applies.
  /* ================= one run with a prevention strategy ================= */
  function viewPrevCell(k, s, p) {

    const base = gridCell(s + "|" + p);
    const v = $("view");
    v.innerHTML = "";
    const o = outcomeOf(pc);
    const strategy = PREV[k].label;

    const banner = el("div", "verdict-banner " + (o.cls === "fail" ? "fail" : "pass"));
    const mins = pc.failure && pc.failure_timestamp != null
      ? Math.round((pc.failure_timestamp - 79200) / 60) : null;
    const baseMins = pc.base_failure_timestamp != null
      ? Math.round((pc.base_failure_timestamp - 79200) / 60) : null;
    const txt = el("div");
    txt.innerHTML = "<p><strong>" + sname(s) + " \u00b7 " + pname(p) + "</strong> with <strong>" +
      strategy.toLowerCase() + "</strong>: " +
      (pc.outcome === "prevented"
        ? "the HCS no longer fails. Without the strategy it failed at <span class='mono'>t = " +
          int(pc.base_failure_timestamp) + " s</span>" + (baseMins != null ? ", " + baseMins + " minutes after the injection" : "") + "."
        : pc.failure
          ? "the HCS still fails, at <span class='mono'>t = " + int(pc.failure_timestamp) + " s</span>" +
            (mins != null ? ", " + mins + " minutes after the injection" : "") +
            (pc.base_failure && baseMins != null
              ? " (without the strategy: " + baseMins + " minutes)." : ".")
          : "the HCS passes, as it did without the strategy.") + "</p>";
    add(banner, el("div", "vg", o.tag), txt);
    v.append(banner);

    /* --- the index, with and without the strategy --- */
    const T = panel("The failed_requests index, with and without " + strategy.toLowerCase(),
      "Solid: the run with the strategy. Dashed: the same run without it. A failing run is drawn up to its failure.");
    T.body.append(indexChart(
      [{ trace: base && base.trace, color: "var(--ink-3)", dash: true,
         cutAt: pc.base_failure && pc.base_failure_timestamp != null ? pc.base_failure_timestamp : null },
       { trace: pc.trace, color: o.cls === "fail" ? "var(--critical)" : "var(--prevented)", strong: true,
         cutAt: pc.failure ? pc.failure_timestamp : null }],
      { event: s === "normal" ? null : G().scenarios[s].window,
        failTs: pc.failure ? pc.failure_timestamp : null,
        xMin: DAY_START, xMax: AXIS_END,
        readoutHint: "Hover the chart to read off a value." }));
    v.append(T.panel);

    /* --- what this run does, same tiles as a run without prevention --- */
    const A = panel("What this run does");
    A.body.append(figs([
      [num(pc.fr_mean_event, 3), "mean failed_requests index during the event"],
      [num(pc.fr_mean, 3), "mean failed_requests index over the whole run"],
      [num(pc.fr_peak, 2), "peak failed_requests index (maximum)"],
      [pc.n_spikes, "spike episodes"],
      [Math.round(pc.spike_minutes) + " min", "total time in spike"],
      [Math.round(pc.spike_minutes_in_event) + " min", "of that, in the event"]
    ]));
    v.append(A.panel);

    /* --- what the strategy changed --- */
    const C = panel("What " + strategy.toLowerCase() + " changed",
      "Every figure is the run with the strategy minus the same run without it.");
    C.body.append(figs([
      [sgn(pc.d_fr_mean_event, 3), "index during the event"],
      [sgn(pc.d_fr_peak, 3), "peak index"],
      [sgn(pc.d_minutes_above_threshold, 0) + " min", "time above the hardiness threshold"],
      [pc.base_failure && pc.failure && pc.delay_min != null ? sgn(pc.delay_min, 0) + " min" : "\u2013",
       "shift of the failure time"],
      [pc.base_failure ? (pc.failure ? "no" : "yes") : "\u2013", "failure removed"]
    ]));
    v.append(C.panel);

    /* --- the rise, and the metrics around the spike: same blocks as elsewhere --- */
    if (pc.d_not_served != null) {
      const R = panel("What the rise is made of",
        "Shapley split of the rise from the pre-spike hour, over the spike that carries the verdict.");
      const rows = [["rides_not_served", pc.d_not_served], ["passengers_cancel", pc.d_cancel],
                    ["passengers_new (demand)", pc.d_demand]];
      R.body.append(metricTable(rows, [
        ["Input", (r) => el("td", "ml", r[0])],
        ["Contribution to the rise", (r) => { const td = el("td", "mono"); td.style.textAlign = "right"; td.textContent = sgn(r[1], 4); return td; }, true]
      ]));
      R.body.append(el("p", "sub", "Unserved requests are " + num((pc.share_not_served || 0) * 100, 0) +
        "% of the failed requests inside the spike."));
      v.append(R.panel);
    }

    if (pc.affected && pc.affected.length) {
      const M = panel("Metrics most out of range inside the spike",
        "Robust z against the run without personality and without event, measured over the same spike.");
      M.body.append(metricTable(pc.affected, [
        ["Metric", (r) => el("td", "ml", r.metric)],
        ["Level", (r) => { const td = el("td", "mono"); td.style.textAlign = "right"; td.textContent = num(r.spike_level, 3); return td; }, true],
        ["vs its own run", (r) => { const td = el("td", "mono"); td.style.textAlign = "right"; td.textContent = sgn(r.dev_vs_own, 1); return td; }, true],
        ["vs reference", (r) => { const td = el("td", "mono"); td.style.textAlign = "right"; td.textContent = sgn(r.dev_vs_reference, 1); return td; }, true]
      ]));
      v.append(M.panel);
    }

    const back = el("div", "cta");
    const bb = el("button", null, "\u2190 the same run without prevention"); bb.type = "button";
    bb.addEventListener("click", () => go("/d/" + s + "/" + p));
    add(back, bb, el("span", "note", "Thresholds are the ones fitted on the no-personality normal run, so the two runs are judged by the same bar."));
    v.append(back);
  }

  // Shown on every view while a strategy is selected: what the page is describing, and how
  // much of the grid that strategy has actually been run on.
  function strategyNote() {
    const g = G();
    const run = g.cells.size, total = SC.length * PE.length;
    const n = el("div", "verdict-banner");
    const t = el("div");
    t.innerHTML = "<p>Showing the runs with <strong>" + PREV[STRAT].label.toLowerCase() +
      "</strong>: <strong>" + run + "</strong> of the " + total + " cells of the grid have been run with it. " +
      "Everything on this page is computed over those runs alone; the rest are marked not run.</p>";
    add(n, el("div", "vg", "PREVENTION"), t);
    return n;
  }

  function strategyToggle() {
    if (!STRATS.length) return null;
    const seg = el("div", "seg");
    const mk = (key, label) => {
      const b = el("button", null, label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(STRAT === key));
      b.addEventListener("click", () => { STRAT = key; go(curPath()); render(); });
      seg.append(b);
    };
    mk(null, "No prevention");
    STRATS.forEach((k) => mk(k, PREV[k].label));
    return seg;
  }

  function paperToggle() {
    const seg = el("div", "seg");
    const btn = el("button", null, "Puccinelli et al.");
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(SHOW_PAPER));
    btn.addEventListener("click", () => { SHOW_PAPER = !SHOW_PAPER; render(); });
    seg.append(btn);
    return seg;
  }

  function render() {
    const r = route();
    // The Puccinelli et al. column only belongs to the grid without prevention; its toggle is
    // hidden when a strategy is selected, so the column must not survive the switch either.
    if (STRAT) SHOW_PAPER = false;
    crumbs(r);
    if (r.v === "cell") viewCell(r.s, r.p);
    else if (r.v === "prevcell") viewPrevCell(r.k, r.s, r.p);
    else if (r.v === "scenario") viewScenario(r.s);
    else if (r.v === "personality") viewPersonality(r.p);
    else if (r.v === "patterns") viewPatterns();
    else viewHome();
    window.scrollTo({ top: 0, behavior: "instant" });
  }
  addEventListener("hashchange", render);
  render();
})();
</script>
